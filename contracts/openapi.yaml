openapi: 3.1.0
info:
  title: Kantin Kampus API
  version: 1.0.0
  description: Kontrak API untuk Website Kantin Kampus (pilot lokal/dev). Sumber kebenaran implementasi: services/api.
servers:
  - url: http://localhost:8080/api/v1
    description: Lokal dev
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
components:
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - OTP_INVALID_OR_EXPIRED
                - RESOURCE_UNAVAILABLE
                - IDEMPOTENCY_CONFLICT
                - PAYMENT_STATE_CONFLICT
                - INTERNAL_ERROR
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
        meta:
          type: object
          properties:
            request_id:
              type: string