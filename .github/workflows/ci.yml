name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kantin
          POSTGRES_PASSWORD: kantin
          POSTGRES_DB: kantin_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kantin -d kantin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KANTIN_TEST_DATABASE_URL: postgres://kantin:kantin@localhost:5432/kantin_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Install migrate CLI
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
      - name: Validate migrations (up)
        run: |
          "$HOME/go/bin/migrate" -path migrations \
            -database "$KANTIN_TEST_DATABASE_URL" up
      - name: Validate migrations (down and up)
        run: |
          "$HOME/go/bin/migrate" -path migrations \
            -database "$KANTIN_TEST_DATABASE_URL" down 1
          "$HOME/go/bin/migrate" -path migrations \
            -database "$KANTIN_TEST_DATABASE_URL" up
      - name: Test (unit + integration)
        run: go test ./... -count=1
      - name: Build
        run: go build ./cmd/api ./cmd/seed

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit (web)
        working-directory: apps/web
        run: npm audit --audit-level=high
