services:
  postgres:
    image: postgres:16-alpine
    container_name: kantin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kantin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kantin}
      POSTGRES_DB: ${POSTGRES_DB:-kantin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kantin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kantin} -d ${POSTGRES_DB:-kantin}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  kantin_pgdata:
